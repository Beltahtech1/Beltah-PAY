<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Pesa STK Push Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6 space-y-6">
    <div class="text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-gray-800">Lipa na M-Pesa</h2>
      <p class="text-sm text-gray-500 mt-1">Enter your details to initiate STK Push</p>
    </div>

    <form id="stkForm" class="space-y-4">
      <div>
        <label for="phone" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Phone Number</label>
        <input 
          type="tel" 
          id="phone" 
          placeholder="0712345678 or 254712345678" 
          required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition"
        >
      </div>

      <div>
        <label for="amount" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Amount (KES)</label>
        <input 
          type="number" 
          id="amount" 
          min="1" 
          placeholder="100" 
          required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition"
        >
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center"
      >
        <span id="btnText">Pay Now</span>
        <span id="btnSpinner" class="hidden">
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </span>
      </button>
    </form>

    <div id="statusBox" class="hidden p-4 rounded-lg text-sm"></div>
  </div>

  <script>
    // Configuration: Set to your hosted Vercel backend URL
    const BACKEND_URL = 'https://your-vercel-app.vercel.app/api/stkpush';
    
    // Set to true to test the UI flow without connecting to a real server
    const USE_SIMULATOR = true;

    const form = document.getElementById('stkForm');
    const phoneInput = document.getElementById('phone');
    const amountInput = document.getElementById('amount');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const statusBox = document.getElementById('statusBox');

    // Phone Number Sanitizer (07... / 01... -> 2547... / 2541...)
    function formatPhoneNumber(phone) {
      let cleaned = phone.replace(/[\s+]/g, '');
      if (cleaned.startsWith('0')) {
        cleaned = '254' + cleaned.slice(1);
      } else if (cleaned.startsWith('7') || cleaned.startsWith('1')) {
        cleaned = '254' + cleaned;
      }
      return cleaned;
    }

    function showStatus(message, isSuccess) {
      statusBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-green-50', 'text-green-700');
      if (isSuccess) {
        statusBox.classList.add('bg-green-50', 'text-green-700');
      } else {
        statusBox.classList.add('bg-red-50', 'text-red-700');
      }
      statusBox.innerHTML = message;
    }

    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        btnText.textContent = 'Processing...';
        btnSpinner.classList.remove('hidden');
      } else {
        submitBtn.disabled = false;
        btnText.textContent = 'Pay Now';
        btnSpinner.classList.add('hidden');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const rawPhone = phoneInput.value;
      const formattedPhone = formatPhoneNumber(rawPhone);
      const amount = amountInput.value;

      if (formattedPhone.length !== 12 || !formattedPhone.startsWith('254')) {
        showStatus('Please enter a valid Kenyan phone number (e.g. 0712345678)', false);
        return;
      }

      setLoading(true);

      if (USE_SIMULATOR) {
        // Local Simulation Mode
        setTimeout(() => {
          setLoading(false);
          showStatus(`<strong>STK Push Prompt Sent!</strong><br>Check <strong>${formattedPhone}</strong> to enter your M-Pesa PIN for KES ${amount}.`, true);
        }, 1500);
      } else {
        // Live Request to your Vercel Node.js Server
        try {
          const response = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: formattedPhone, amount: amount })
          });

          const data = await response.json();

          if (response.ok && data.ResponseCode === '0') {
            showStatus(`<strong>STK Push Prompt Sent!</strong><br>Check your phone (${formattedPhone}) to complete payment.`, true);
          } else {
            const errorMsg = data.CustomerMessage || data.error || 'Failed to initiate STK push.';
            showStatus(`<strong>Error:</strong> ${errorMsg}`, false);
          }
        } catch (error) {
          showStatus(`<strong>Network Error:</strong> Could not connect to API server.`, false);
        } finally {
          setLoading(false);
        }
      }
    });
  </script>
</body>
</html>
